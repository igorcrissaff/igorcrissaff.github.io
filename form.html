<!-- Contact form For later implementation-->

<form class="form-signup" id="contactForm" action="https://formsubmit.co/your@email.com" method="POST">
    <!-- Email address input-->
    <div class="row input-group-newsletter">
        <div class="col"><input class="form-control" id="emailAddress" type="email" placeholder="Insira seu email..." aria-label="Enter email address..." data-sb-validations="required,email" /></div>
        <div class="col-auto"><button class="btn btn-primary disabled" id="submitButton" type="submit">Notificar!</button></div>
    </div>
    <div class="invalid-feedback mt-2" data-sb-feedback="emailAddress:required">Email necessário.</div>
    <div class="invalid-feedback mt-2" data-sb-feedback="emailAddress:email">Email não é válido.</div>
    <!-- Submit success message-->
    <!---->
    <!-- This is what your users will see when the form-->
    <!-- has successfully submitted-->
    <div class="d-none" id="submitSuccessMessage">
        <div class="text-center mb-3 mt-2 text-white">
            <div class="fw-bolder">Email enviado com sucesso!</div>

        </div>
    </div>
    <!-- Submit error message-->
    <!---->
    <!-- This is what your users will see when there is-->
    <!-- an error submitting the form-->
    <div class="d-none" id="submitErrorMessage"><div class="text-center text-danger mb-3 mt-2">Error sending message!</div></div>
</form>
